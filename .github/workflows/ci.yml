name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - develop

permissions:
  contents: read
  checks: write

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m py_compile scripts/send-feedpaper-email.py

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Azure/setup-helm@v5.0.1
      - run: |
          set -euo pipefail
          helm lint ./helm/feedpaper
          helm lint ./helm/feedpaper -f ./helm/feedpaper/values.production.yaml
          helm template ./helm/feedpaper >/dev/null
          helm template ./helm/feedpaper -f ./helm/feedpaper/values.production.yaml >/dev/null

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
