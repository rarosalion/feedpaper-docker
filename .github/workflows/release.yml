name: Create semantic version release

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      bump:
        description: Force a specific version bump instead of detecting one from commit messages
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      prerelease:
        description: Mark the release as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine next semantic version
        id: version
        shell: bash
        env:
          BUMP: ${{ github.event.inputs.bump || 'auto' }}
        run: |
          set -euo pipefail

          latest=$(git tag --list 'v*' --sort=-version:refname | head -n 1 || true)
          current=${latest#v}
          IFS='.' read -r major minor patch <<< "${current:-0.0.0}"

          if [[ "$BUMP" == "auto" ]]; then
            range="HEAD"
            [[ -n "$latest" ]] && range="${latest}..HEAD"
            subjects=$(git log "$range" --format='%s')
            bodies=$(git log "$range" --format='%b')

            bump=none
            if grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' <<< "$subjects" || grep -q 'BREAKING CHANGE' <<< "$bodies"; then
              bump=major
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$subjects"; then
              bump=minor
            elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<< "$subjects"; then
              bump=patch
            fi
          else
            bump="$BUMP"
          fi

          if [[ "$bump" == "none" ]]; then
            echo "No feat/fix/perf/breaking commits since ${latest:-the beginning of history}; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          next_tag="v${major}.${minor}.${patch}"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "next_tag=${next_tag}" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        if: steps.version.outputs.should_release == 'true'
        env:
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NEXT_TAG"
          git push origin "$NEXT_TAG"

      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$NEXT_TAG" \
              --title "$NEXT_TAG" \
              --generate-notes \
              --prerelease
          else
            gh release create "$NEXT_TAG" \
              --title "$NEXT_TAG" \
              --generate-notes
          fi
