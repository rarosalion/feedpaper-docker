name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_run:
    workflows:
      - Create semantic version release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: rarosalion/feedpaper-docker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # release.yml tags/publishes using the default GITHUB_TOKEN, which GitHub
  # deliberately excludes from triggering push/release events on other
  # workflows (anti-recursion guard). workflow_run is the documented escape
  # hatch for this exact case, so this job picks up the tag it left behind.
  docker-from-release:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-tags: true

      - name: Find release tag for this commit
        id: release_tag
        run: |
          set -euo pipefail
          tag=$(git tag --list 'v*' --points-at HEAD | sort -V | tail -n1)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "found=$([[ -n "$tag" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.release_tag.outputs.found == 'true'
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        if: steps.release_tag.outputs.found == 'true'
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to Docker Hub
        if: steps.release_tag.outputs.found == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: steps.release_tag.outputs.found == 'true'
        uses: docker/metadata-action@v6.2.0
        with:
          images: rarosalion/feedpaper-docker
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.release_tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release_tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release_tag.outputs.tag }}

      - name: Build and push image
        if: steps.release_tag.outputs.found == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
