image:
  repository: jonashonecker/feedpaper
  tag: "v0.1.3"
  pullPolicy: IfNotPresent

feedpaper:
  schedule: "0 6 * * *"
  timezone: UTC
  outputDir: /output
  keepUnread: false
  extraArgs: []
  config:
    email: "you@example.com"
    password: "your-feedbin-password"
    excludes:
      - "Hacker Newsletter"
      - "neal.fun"

mail:
  enabled: true
  to: "reader@example.com"
  from: "feedpaper@example.com"
  subject: "Your daily feedpaper"
  smtpHost: "smtp.example.com"
  smtpPort: 587
  smtpStartTls: true
  smtpUsername: "smtp-user"
  smtpPassword: "smtp-password"

cronjob:
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  suspend: false
  pod:
    annotations:
      checksum/config: "set-me-with-your-deploy"
    labels: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL

persistence:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteOnce
  storageClass: "standard"
