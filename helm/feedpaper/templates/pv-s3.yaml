{{- if and .Values.persistence.enabled (eq .Values.persistence.type "s3") }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "feedpaper.fullname" . }}-output-pv
  labels:
    app.kubernetes.io/name: {{ include "feedpaper.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  capacity:
    storage: {{ .Values.persistence.size }} # ignored by the S3 CSI driver, required by the API
  accessModes:
    - {{ .Values.persistence.accessMode }}
  storageClassName: ""
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ include "feedpaper.fullname" . }}-output
  mountOptions:
    - allow-other
    - allow-delete
    - endpoint-url {{ required "persistence.s3.endpointUrl is required when persistence.type=s3" .Values.persistence.s3.endpointUrl }}
    - region {{ .Values.persistence.s3.region }}
    - force-path-style
    - file-mode {{ .Values.persistence.s3.fileMode }}
    - dir-mode {{ .Values.persistence.s3.dirMode }}
    {{- range .Values.persistence.s3.extraMountOptions }}
    - {{ . }}
    {{- end }}
  csi:
    driver: s3.csi.aws.com
    volumeHandle: {{ include "feedpaper.fullname" . }}-output-volume
    volumeAttributes:
      bucketName: {{ required "persistence.s3.bucketName is required when persistence.type=s3" .Values.persistence.s3.bucketName | quote }}
{{- end }}
