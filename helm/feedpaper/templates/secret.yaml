{{- if or .Values.feedpaper.config.email .Values.feedpaper.config.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "feedpaper.fullname" . }}-config
type: Opaque
stringData:
  config: |
    # Generated by the feedpaper Helm chart.
    email = {{ .Values.feedpaper.config.email }}
    password = {{ .Values.feedpaper.config.password }}
    {{- range .Values.feedpaper.config.excludes }}
    exclude = {{ . }}
    {{- end }}
{{- end }}
